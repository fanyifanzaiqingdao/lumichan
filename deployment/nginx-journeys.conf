# Add these server-level redirects to BOTH HTTP and HTTPS site blocks in BaoTa.
# Existing query parameters are retained. Do not put these inside location /.
# All Journey pages now use /journeys/ (and language-prefixed equivalents).
rewrite ^/(zh|ja|es|zh-tw|ko|fr|de|it)/traveler/journeys/chengdu-cultural-gateway/?$ /$1/journeys/cultural-gateway/ permanent;
rewrite ^/(zh|ja|es|zh-tw|ko|fr|de|it)/traveler/journeys(?:/(.*))?/?$ /$1/journeys/$2 permanent;
rewrite ^/traveler/journeys/chengdu-cultural-gateway/?$ /journeys/cultural-gateway/ permanent;
rewrite ^/traveler/journeys(?:/(.*))?/?$ /journeys/$1 permanent;
rewrite ^/(zh|ja|es|zh-tw|ko|fr|de|it)/journeys/chengdu-cultural-gateway/?$ /$1/journeys/cultural-gateway/ permanent;
rewrite ^/journeys/chengdu-cultural-gateway/?$ /journeys/cultural-gateway/ permanent;
